#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;pointer-events:none}

.g{display:flex;flex-wrap:wrap;gap:6px}

mk('Vistas',[['Frente',0,0],['Espalda',Math.PI,0],['Izquierda',-Math.PI/2,0],['Derecha',Math.PI/2,0],['Arriba',0,1.15],['Abajo',0,-1.15]].map(([l,y,x])=>[l,()=>{st.vy=y;st.vx=x}]));mk('Conversaciones de prueba',['¿Qué es un ecosistema?','Cuéntame de los capibaras','¿Cómo reciclo bien?','¿Cómo cuido el agua?','¿Qué es el cambio climático?','¿Cuánto pesa la luna?'].map(q=>[q,()=>{$('#in').value='';ask(q)}]));
$('#tog').onclick=()=>$('#panel').classList.toggle('on');if(innerWidth>900)$('#panel').classList.add('on');
$('#start').onclick=e=>{e.target.remove();greet()};
const go=()=>{const v=$('#in').value;$('#in').value='';ask(v)};$('#go').onclick=go;
let tw;$('#in').addEventListener('input',()=>{if(st.mode==='idle'||st.mode==='waiting'){setMode('waiting');setExpression('curiosa');clearTimeout(tw);tw=setTimeout(()=>{if(st.mode==='waiting'){setMode('idle');setExpression('neutral')}},1600)}});
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
if(!SR)$('#mic').style.display='none';else $('#mic').onclick=()=>listen(st.mode!=='listening');
let lx0=0;cv.addEventListener('pointerdown',e=>{st.drag=1;lx0=e.clientX;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{st.px=e.clientX/innerWidth*2-1;st.py=-(e.clientY/innerHeight*2-1);if(st.drag){G.rotation.y+=(e.clientX-lx0)*.01;lx0=e.clientX}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>st.drag=0));
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;const d=9.5*Math.max(1,.62/(w/h));cam.position.set(0,1.5,d);cam.lookAt(0,1.1,0);cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
// ---------- Animación ----------
let t=0,last=performance.now();
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
const k=Math.min(1,dt*6);for(const q in tgt)cur[q]+=(tgt[q]-cur[q])*k;
let bl=1;if(st.bp<0&&t>st.nb)st.bp=0;
if(st.bp>=0){st.bp+=dt/.17;bl=1-(st.bp<1?st.bp:2-st.bp)*.94;if(st.bp>=2){st.bp=-1;st.nb=t+(Math.random()<.2?.25:1.8+Math.random()*3.6)}}
st.tl+=((st.talk?1:0)-st.tl)*Math.min(1,dt*10);
let amp=0;if(st.talk){if(st.an){st.an.getByteTimeDomainData(st.buf);let s=0;for(const v of st.buf){const x=(v-128)/128;s+=x*x}amp=Math.min(1,Math.sqrt(s/st.buf.length)*5)}else amp=(.5+.5*Math.sin(t*13))*(.55+.45*Math.sin(t*4.1+1))}
st.lx+=(st.px-st.lx)*dt*3;st.ly+=(st.py-st.ly)*dt*3;const look=st.mode==='thinking'?0:1;
let jy=0,jw=0,ww=0;
if(st.j>=0){st.j+=dt/.85;if(st.j>=1)st.j=-1;else{jw=Math.sin(st.j*Math.PI);jy=jw*st.jh}}
if(st.w>=0){st.w+=dt/2.4;if(st.w>=1)st.w=-1;else ww=Math.min(1,Math.sin(st.w*Math.PI)*3)}
root.position.y=(st.fl?.12+Math.sin(t*1.4)*.08:0)+cur.lift+jy;
const br=Math.sin(t*1.8)*.015;torso.scale.set(1-br*.5,1.05+br*1.4,.9-br*.5);
root.scale.y=1+.05*jw-cur.sq*.5;root.rotation.z=Math.sin(t*.8)*.035;root.rotation.y=Math.sin(t*.55)*.1+st.lx*.12*look;
hp.rotation.set(cur.hp-st.ly*.12*look+Math.sin(t*6.5)*.03*amp*st.tl,cur.hy+st.lx*.3*look+Math.sin(t*.7)*.04,cur.ht+Math.sin(t*.9)*.025);
[[eL,cur.eL],[eR,cur.eR]].forEach(([e,o])=>{e.setLid(o*bl,Math.max(0,Math.min(1,(cur.mw-1.12)/.1)));e.pg.position.x=(cur.ex+st.lx*look*.6)*.05;e.pg.position.y=(cur.ey+st.ly*look*.6)*.05});
bL.position.y=bR.position.y=.46+cur.b-(1-bl)*.025;bL.rotation.z=cur.bt;bR.rotation.z=-cur.bt;
const mo=Math.min(1.2,cur.mo+amp*.75*st.tl);inner.scale.set(cur.mw*(1-amp*.25*st.tl),Math.max(.01,mo),.5);inner.position.y=-mo*.04;
const mc=Math.abs(cur.mc)<.06?.06:cur.mc;lips.scale.set(cur.mw*.9,mc,1);lips.position.y=.05*Math.max(-1,Math.min(1,cur.mc*3));
let rz=.25+Math.sin(t*1.8)*.03+st.tl*Math.sin(t*3)*.1,lz=-.25-Math.sin(t*1.8+1)*.03;
rz+=(2.3-rz)*jw;lz+=(-2.3-lz)*jw;rz+=(2.6+Math.sin(t*10)*.35-rz)*ww;aR.rotation.z=rz;aL.rotation.z=lz;aR.rotation.x=-.2*ww;
lgL.rotation.x=Math.sin(t*1.4)*.05;lgR.rotation.x=-Math.sin(t*1.4)*.05;cape.rotation.x=Math.sin(t*1.5)*.06+jy*.3;
leaves.forEach(p=>{const u=p.userData;p.quaternion.copy(u.q);p.rotateX(Math.sin(t*1.3+u.ph)*.06);p.rotateZ(Math.sin(t*1.1+u.ph*1.3)*.04)});
flowers.forEach((f,i)=>f.scale.setScalar(1+Math.sin(t*2+i)*.05));
shadow.scale.setScalar(1-root.position.y*.25);shadow.material.opacity=1-root.position.y*.4;
if(!st.drag){const q=Math.min(1,dt*4);G.rotation.y+=(st.vy-G.rotation.y)*q;G.rotation.x+=(st.vx-G.rotation.x)*q}
for(let i=1;i<N*3;i+=3){pp[i]+=dt*.1;if(pp[i]>3.6)pp[i]=-.5}mg.attributes.position.needsUpdate=true;
R.render(S,cam)}
requestAnimationFrame(tick);
})();
</script></body></html>
